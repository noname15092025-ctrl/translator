<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Толмач</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f6a73'/%3E%3Ctext x='32' y='47' font-family='Arial,sans-serif' font-size='44' font-weight='700' fill='white' text-anchor='middle'%3E%D0%A2%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&family=Onest:wght@400;500;600&display=swap">
<style>
/* One split card, like a sheet folded in half: source on the left, translation on the right */
:root{
  --bg:#e9eef2; --glow:#cfe3e6; --card:#ffffff; --side:#f6f8fa; --line:#dde3e8;
  --fg:#121a22; --muted:#66737f; --accent:#0d6e78; --on-accent:#ffffff; --soft:#dcefef; --warn:#a15c00;
  --shadow:0 1px 2px rgb(16 30 40 / .06), 0 18px 50px -20px rgb(16 40 50 / .25);
  --display:"Unbounded",system-ui,sans-serif; --ui:"Onest",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1014; --glow:#0f2a2e; --card:#141b21; --side:#11171c; --line:#243039;
  --fg:#e7edf1; --muted:#8d9aa5; --accent:#46c1cb; --on-accent:#06262a; --soft:#123236; --warn:#e4ad52;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 24px 60px -24px rgb(0 0 0 / .7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1014; --glow:#0f2a2e; --card:#141b21; --side:#11171c; --line:#243039;
  --fg:#e7edf1; --muted:#8d9aa5; --accent:#46c1cb; --on-accent:#06262a; --soft:#123236; --warn:#e4ad52;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 24px 60px -24px rgb(0 0 0 / .7); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--fg);font:15px/1.5 var(--ui);
  background:radial-gradient(1200px 500px at 15% -10%, var(--glow), transparent 70%), var(--bg);background-attachment:fixed}
.wrap{max-width:1120px;margin:0 auto;padding-block:32px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.logo{width:44px;height:44px;border-radius:13px;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font:600 24px/1 var(--display);flex:none}
h1{font:600 22px/1.1 var(--display);margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-top:4px}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  padding:10px 12px;border-bottom:1px solid var(--line)}
.lang{appearance:none;font:600 15px var(--ui);color:var(--fg);background:transparent;border:0;
  padding:8px 12px;border-radius:10px;cursor:pointer;justify-self:start}
.lang:hover{background:var(--side)}
.top .lang:last-child{justify-self:start}
.swap{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  color:var(--fg);font-size:18px;cursor:pointer;transition:transform .25s ease, border-color .2s}
.swap:hover{border-color:var(--accent);transform:rotate(180deg)}

.grid{display:grid;grid-template-columns:1fr 1fr}
.pane{display:flex;flex-direction:column;min-width:0;transition:background .2s}
.pane + .pane{background:var(--side);border-left:1px solid var(--line)}
.pane.drag{background:var(--soft);outline:2px dashed var(--accent);outline-offset:-10px}
textarea,.out{font:400 21px/1.55 var(--ui);color:var(--fg);background:transparent;border:0;resize:none;
  min-height:300px;padding:22px 24px;width:100%;white-space:pre-wrap;overflow-wrap:anywhere;flex:1}
textarea::placeholder{color:var(--muted)}
textarea:focus{outline:none}
.out:empty::before{content:"Здесь появится перевод";color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;
  padding:10px 14px;font-size:13px;color:var(--muted)}
.foot span{display:flex;gap:6px;align-items:center}
.tool{font:500 13px var(--ui);color:var(--fg);background:transparent;border:1px solid var(--line);
  border-radius:999px;padding:7px 13px;cursor:pointer}
.tool:hover{border-color:var(--accent);color:var(--accent)}
#count{font-variant-numeric:tabular-nums}

.below{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:16px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.seg button{font:500 13px var(--ui);color:var(--muted);background:transparent;border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.status{font-size:13px;color:var(--muted);min-height:20px;display:flex;align-items:center;gap:10px}
#status.warn{color:var(--warn)}
progress{width:140px;height:6px;accent-color:var(--accent)}
.note{margin:28px 0 0;font-size:13px;color:var(--muted);max-width:65ch}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media (max-width:760px){
  .grid{grid-template-columns:1fr}
  .pane + .pane{border-left:0;border-top:1px solid var(--line)}
  textarea,.out{min-height:180px;font-size:19px;padding:18px}
  h1{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">Т</div>
    <div>
      <h1>Толмач</h1>
      <div class="sub">Русский ⇄ английский. Бесплатно и без регистрации.</div>
    </div>
  </header>

  <div class="card">
    <div class="top">
      <select id="src" class="lang" aria-label="Язык оригинала"></select>
      <button id="swap" class="swap" title="Поменять языки" aria-label="Поменять языки">⇄</button>
      <select id="tgt" class="lang" aria-label="Язык перевода"></select>
    </div>
    <div class="grid">
      <div class="pane" id="drop">
        <textarea id="input" placeholder="Введите текст, перетащите картинку или вставьте скриншот (Ctrl+V)">Привет! Это бесплатный переводчик без регистрации.</textarea>
        <div class="foot">
          <span id="count">0 / 5000</span>
          <span>
            <button id="pick" class="tool">Картинка</button>
            <button id="clear" class="tool">Очистить</button>
          </span>
          <input type="file" id="file" accept="image/*" hidden>
        </div>
      </div>
      <div class="pane">
        <div class="out" id="output" aria-live="polite"></div>
        <div class="foot">
          <span id="engine">Перевод онлайн</span>
          <button id="copy" class="tool">Копировать</button>
        </div>
      </div>
    </div>
  </div>

  <div class="below">
    <div class="seg" role="group" aria-label="Кто переводит">
      <button type="button" data-mode="ai" aria-pressed="true">Переводит ИИ</button>
      <button type="button" data-mode="fast" aria-pressed="false">Быстро (Google)</button>
    </div>
    <select id="mode" hidden>
      <option value="ai">ai</option>
      <option value="fast">fast</option>
    </select>
    <button id="go" hidden>Перевести</button>
    <div class="status"><span id="status"></span><progress id="prog" max="100" value="0" hidden></progress></div>
  </div>

  <p class="note">Перевод запускается сам, как только вы перестаёте печатать. В режиме «Переводит ИИ» текст переводит нейросеть, а если она занята, подстраховывает Google. Текст с картинок распознаётся прямо в браузере.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script type="module">
// язык: [название, код для распознавания картинок]
const LANGS = { ru:["Русский","rus"], en:["English","eng"] };
const MAX = 5000;
const $ = id => document.getElementById(id);
const src = $("src"), tgt = $("tgt"), input = $("input"), output = $("output"),
      status = $("status"), prog = $("prog");

for (const [code,[name]] of Object.entries(LANGS)) {
  src.add(new Option(name, code)); tgt.add(new Option(name, code));
}
src.value = "ru"; tgt.value = "en";
// языков два, поэтому второй список всегда противоположен первому
const other = l => l === "ru" ? "en" : "ru";
// направление само подстраивается под текст: есть кириллица → с русского
function autoDirection() {
  const t = input.value, cyr = (t.match(/[а-яё]/gi) || []).length, lat = (t.match(/[a-z]/gi) || []).length;
  if (!cyr && !lat) return;
  const from = cyr >= lat ? "ru" : "en";
  if (src.value !== from) { src.value = from; tgt.value = other(from); }
}

const setStatus = (t, warn=false) => { status.textContent = t; status.classList.toggle("warn", warn); };
const updCount = () => { $("count").textContent = `${input.value.length} / ${MAX}`; };

// ---------- перевод через интернет ----------
// режем текст на куски до ~1500 символов по границам строк/предложений
function pieces(text, size = 1500) {
  const parts = text.match(/[^\n.!?…]+[.!?…]*\s*|\n+/g) || [text];
  const out = []; let cur = "";
  for (const p of parts) {
    if ((cur + p).length > size && cur) { out.push(cur); cur = ""; }
    cur += p;
  }
  if (cur) out.push(cur);
  return out;
}

async function google(text, a, b) {
  const url = "https://translate.googleapis.com/translate_a/single?client=gtx&dt=t"
    + `&sl=${a}&tl=${b}&q=${encodeURIComponent(text)}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error("google " + r.status);
  const d = await r.json();
  return { text: d[0].map(x => x[0]).join(""), lang: d[2] };
}

async function mymemory(text, a, b) {
  const from = a === "auto" ? "Autodetect" : a;
  const res = [];
  for (const p of pieces(text, 450)) {
    const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(p)}&langpair=${from}|${b}`);
    const d = await r.json();
    if (d.responseStatus != 200) throw new Error("mymemory " + d.responseStatus);
    res.push(d.responseData.translatedText);
  }
  return { text: res.join(" ") };
}

// ---------- ИИ ----------
// адрес посредника на Cloudflare (DeepSeek через OpenRouter). Пусто = не используется.
const WORKER_URL = "https://translater.noname15092025.workers.dev";
async function deepseek(text, b) {
  const r = await fetch(WORKER_URL, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text, to: b }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || !d.text) throw new Error("worker " + r.status + " " + (d.error || ""));
  return { text: d.text, by: "ИИ" };
}
let aiFreeAt = 0; // когда снова можно звать ИИ (лимит бесплатного режима)
async function ai(text, a, b) {
  const to = LANGS[b][0], from = a === "auto" ? "" : ` from ${LANGS[a][0]}`;
  const r = await fetch("https://text.pollinations.ai/openai", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: "openai", messages: [
      { role: "system", content: `You are a professional translator. Translate the user's text${from} into ${to}. Keep meaning, tone, line breaks and formatting. Output only the translation, no comments.` },
      { role: "user", content: text } ] })
  });
  if (r.status === 402 || r.status === 429) {
    const m = (await r.text()).match(/wait (\d+) sec/);
    aiFreeAt = Date.now() + (m ? +m[1] : 45) * 1000;
    throw new Error("limit");
  }
  if (!r.ok) throw new Error("ai " + r.status);
  const d = await r.json();
  const out = d.choices?.[0]?.message?.content?.trim();
  if (!out) throw new Error("ai empty");
  aiFreeAt = Date.now() + 45000;
  return { text: out, by: "ИИ" };
}

const done = new Map();
async function translateStep(text, a, b, useAi) {
  const key = `${useAi ? "ai" : "g"}|${a}|${b}|${text}`;
  if (done.has(key)) return done.get(key);
  let res;
  if (useAi && WORKER_URL) {
    try { res = await deepseek(text, b); done.set(key, res); return res; }
    catch (e) { console.warn(e); }
  }
  if (useAi) {
    if (Date.now() >= aiFreeAt) {
      try { res = await ai(text, a, b); done.set(key, res); return res; }
      catch (e) { console.warn(e); }
    }
    const sec = Math.max(1, Math.ceil((aiFreeAt - Date.now()) / 1000));
    aiNote = `ИИ будет доступен через ${sec} с, пока перевёл Google`;
  }
  try {
    const parts = await Promise.all(pieces(text).map(p => google(p, a, b)));
    res = { text: parts.map(p => p.text).join(""), lang: parts[0].lang };
  } catch (e) {
    console.warn(e);
    res = await mymemory(text, a, b);
  }
  done.set(key, res);
  return res;
}

let busy = false, again = false, lastLang = null;
let aiNote = "";
async function translate(manual = false) {
  const useAi = $("mode").value === "ai";
  aiNote = "";
  autoDirection();
  const text = input.value.slice(0, MAX).trim();
  const a = src.value, b = tgt.value;
  if (!text) { output.textContent = ""; return; }
  if (a === b && a !== "auto") { output.textContent = text; return; }
  if (busy) { again = true; return; }
  busy = true;
  try {
    setStatus("Перевожу…");
    // в режиме ИИ сначала мгновенно показываем черновик от Google, потом заменяем ИИ-переводом
    if (useAi && !done.has(`ai|${a}|${b}|${text}`)) {
      try {
        const draft = await translateStep(text, a, b, false);
        if (input.value.slice(0, MAX).trim() === text) {
          output.textContent = draft.text;
          $("engine").textContent = "Черновик Google";
          setStatus("ИИ уточняет перевод…");
        }
      } catch (e) { console.warn(e); }
    }
    const r = await translateStep(text, a, b, useAi);
    if (input.value.slice(0, MAX).trim() !== text) return; // текст уже поменяли, ждём новый перевод
    lastLang = r.lang || null;
    if (a === "auto" && r.lang && LANGS[r.lang]) $("engine").textContent = "Язык оригинала: " + LANGS[r.lang][0];
    else $("engine").textContent = r.by === "ИИ" ? "Перевёл ИИ" : "Перевёл Google";
    output.textContent = r.text;
    setStatus(aiNote || "Готово", !!aiNote);
  } catch (e) {
    console.error(e);
    setStatus("Не удалось перевести. Проверьте интернет и попробуйте ещё раз.", true);
  } finally {
    prog.hidden = true; busy = false;
    if (again) { again = false; translate(manual); }
  }
}

let timer;
input.addEventListener("input", () => { updCount(); clearTimeout(timer); timer = setTimeout(translate, $("mode").value === "ai" ? 600 : 350); });
$("go").onclick = () => translate(true);
input.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); translate(true); } });
$("mode").onchange = () => { try { localStorage.mode = $("mode").value; } catch {} ; translate(true); };
try { if (localStorage.mode) $("mode").value = localStorage.mode; } catch {}
const segBtns = document.querySelectorAll(".seg button");
const syncSeg = () => segBtns.forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === $("mode").value));
segBtns.forEach(b => b.onclick = () => { $("mode").value = b.dataset.mode; syncSeg(); $("mode").onchange(); });
syncSeg();
src.onchange = () => { tgt.value = other(src.value); translate(); };
tgt.onchange = () => { src.value = other(tgt.value); translate(); };
$("swap").onclick = () => {
  const from = src.value;
  src.value = tgt.value; tgt.value = from;
  if (output.textContent) input.value = output.textContent;
  updCount(); translate(true);
};
$("clear").onclick = () => { input.value = ""; output.textContent = ""; updCount(); input.focus(); };
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(output.textContent); setStatus("Скопировано"); $("copy").textContent = "Скопировано ✓"; setTimeout(() => $("copy").textContent = "Копировать", 1500); }
  catch { const r = document.createRange(); r.selectNodeContents(output);
          getSelection().removeAllRanges(); getSelection().addRange(r); setStatus("Выделено, нажмите Ctrl+C"); }
};

// ---------- картинки (OCR) ----------
async function ocr(file) {
  if (!file || !file.type.startsWith("image/")) { setStatus("Это не картинка", true); return; }
  try {
    setStatus("Распознаю текст на картинке…");
    prog.hidden = false; prog.value = 0;
    const langs = "rus+eng";
    const { data } = await Tesseract.recognize(file, langs, {
      logger: m => { if (m.progress != null) { prog.value = m.progress * 100;
        setStatus(m.status === "recognizing text" ? `Распознаю: ${Math.round(m.progress*100)}%` : "Готовлю распознавание…"); } }
    });
    const text = data.text.replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
    if (!text) { setStatus("На картинке не нашлось текста", true); prog.hidden = true; return; }
    input.value = text; updCount();
    prog.hidden = true;
    translate(true);
  } catch (e) {
    console.error(e); prog.hidden = true;
    setStatus("Не удалось распознать картинку", true);
  }
}

$("pick").onclick = () => $("file").click();
$("file").onchange = e => ocr(e.target.files[0]);
const drop = $("drop");
["dragenter","dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("drag"); }));
["dragleave","drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("drag"); }));
drop.addEventListener("drop", e => ocr(e.dataTransfer.files[0]));
document.addEventListener("paste", e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
  if (item) { e.preventDefault(); ocr(item.getAsFile()); }
});

updCount();
translate();
</script>
</body>
</html>
