<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Перевод без регистрации</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Two-pane workbench: source left, result right; stacks on phones */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --line:#d8dee5; --fg:#16202b; --muted:#5d6b7a;
  --accent:#0f6a73; --accent-soft:#e1f0f1; --warn:#9a5b00;
  --ui:"Manrope",system-ui,sans-serif; --text:"Source Serif 4",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1418; --panel:#171e24; --line:#2a343d; --fg:#e6ecf1; --muted:#93a1ae;
  --accent:#4fb8c2; --accent-soft:#16343a; --warn:#e0a94a; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--ui)}
.wrap{max-width:1100px;margin:0 auto;padding-block:28px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:18px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
select,button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0}
.pane.drag{border-color:var(--accent);background:var(--accent-soft)}
textarea,.out{font:18px/1.6 var(--text);color:var(--fg);background:transparent;border:0;resize:vertical;
  min-height:260px;padding:16px;width:100%;white-space:pre-wrap;overflow-wrap:anywhere}
.out{flex:1}
.out:empty::before{content:"Здесь появится перевод";color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;
  border-top:1px solid var(--line);padding:8px 12px;font-size:13px;color:var(--muted)}
.status{font-size:13px;color:var(--muted);min-height:20px;margin-top:10px}
.status.warn{color:var(--warn)}
progress{width:160px;accent-color:var(--accent)}
.note{margin-top:22px;font-size:13px;color:var(--muted);max-width:65ch}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Перевод без регистрации</h1>
    <span class="sub">Бесплатно, без регистрации и без скачивания моделей.</span>
  </header>

  <div class="bar">
    <select id="src" aria-label="Язык оригинала"></select>
    <button id="swap" title="Поменять языки">⇄</button>
    <select id="tgt" aria-label="Язык перевода"></select>
    <button id="go" class="primary">Перевести</button>
  </div>

  <div class="grid">
    <div class="pane" id="drop">
      <textarea id="input" placeholder="Вставьте текст, или перетащите сюда картинку, или нажмите Ctrl+V со скриншотом">Привет! Это бесплатный переводчик без регистрации.</textarea>
      <div class="foot">
        <span id="count">0 / 5000</span>
        <span>
          <button id="pick">Картинка…</button>
          <button id="clear">Очистить</button>
        </span>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
    </div>
    <div class="pane">
      <div class="out" id="output" aria-live="polite"></div>
      <div class="foot">
        <span id="engine">Перевод онлайн</span>
        <button id="copy">Копировать</button>
      </div>
    </div>
  </div>

  <div class="status" id="status"></div>
  <progress id="prog" max="100" value="0" hidden></progress>

  <p class="note">Текст переводится онлайн через Google Translate, при сбое через MyMemory, поэтому нужен интернет. Текст с картинок распознаётся прямо в браузере.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script type="module">
// язык: [название, код для распознавания картинок]
const LANGS = { auto:["Определить язык","rus+eng"], ru:["Русский","rus"], en:["English","eng"],
  be:["Беларуская","bel"], uk:["Українська","ukr"], pl:["Polski","pol"], de:["Deutsch","deu"],
  fr:["Français","fra"], es:["Español","spa"], it:["Italiano","ita"], pt:["Português","por"],
  tr:["Türkçe","tur"], zh:["中文","chi_sim"], ja:["日本語","jpn"], ko:["한국어","kor"], ar:["العربية","ara"] };
const MAX = 5000;
const $ = id => document.getElementById(id);
const src = $("src"), tgt = $("tgt"), input = $("input"), output = $("output"),
      status = $("status"), prog = $("prog");

for (const [code,[name]] of Object.entries(LANGS)) {
  src.add(new Option(name, code));
  if (code !== "auto") tgt.add(new Option(name, code));
}
src.value = "auto"; tgt.value = "en";

const setStatus = (t, warn=false) => { status.textContent = t; status.classList.toggle("warn", warn); };
const updCount = () => { $("count").textContent = `${input.value.length} / ${MAX}`; };

// ---------- перевод через интернет ----------
// режем текст на куски до ~1500 символов по границам строк/предложений
function pieces(text, size = 1500) {
  const parts = text.match(/[^\n.!?…]+[.!?…]*\s*|\n+/g) || [text];
  const out = []; let cur = "";
  for (const p of parts) {
    if ((cur + p).length > size && cur) { out.push(cur); cur = ""; }
    cur += p;
  }
  if (cur) out.push(cur);
  return out;
}

async function google(text, a, b) {
  const url = "https://translate.googleapis.com/translate_a/single?client=gtx&dt=t"
    + `&sl=${a}&tl=${b}&q=${encodeURIComponent(text)}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error("google " + r.status);
  const d = await r.json();
  return { text: d[0].map(x => x[0]).join(""), lang: d[2] };
}

async function mymemory(text, a, b) {
  const from = a === "auto" ? "Autodetect" : a;
  const res = [];
  for (const p of pieces(text, 450)) {
    const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(p)}&langpair=${from}|${b}`);
    const d = await r.json();
    if (d.responseStatus != 200) throw new Error("mymemory " + d.responseStatus);
    res.push(d.responseData.translatedText);
  }
  return { text: res.join(" ") };
}

const done = new Map();
async function translateStep(text, a, b) {
  const key = `${a}|${b}|${text}`;
  if (done.has(key)) return done.get(key);
  let res;
  try {
    const parts = await Promise.all(pieces(text).map(p => google(p, a, b)));
    res = { text: parts.map(p => p.text).join(""), lang: parts[0].lang };
  } catch (e) {
    console.warn(e);
    res = await mymemory(text, a, b);
  }
  done.set(key, res);
  return res;
}

let busy = false, again = false, lastLang = null;
async function translate() {
  const text = input.value.slice(0, MAX).trim();
  const a = src.value, b = tgt.value;
  if (!text) { output.textContent = ""; return; }
  if (a === b && a !== "auto") { output.textContent = text; return; }
  if (busy) { again = true; return; }
  busy = true;
  try {
    setStatus("Перевожу…");
    const r = await translateStep(text, a, b);
    lastLang = r.lang || null;
    if (a === "auto" && r.lang && LANGS[r.lang]) $("engine").textContent = "Язык оригинала: " + LANGS[r.lang][0];
    else $("engine").textContent = "Перевод онлайн";
    output.textContent = r.text;
    setStatus("Готово");
  } catch (e) {
    console.error(e);
    setStatus("Не удалось перевести. Проверьте интернет и попробуйте ещё раз.", true);
  } finally {
    prog.hidden = true; busy = false;
    if (again) { again = false; translate(); }
  }
}

let timer;
input.addEventListener("input", () => { updCount(); clearTimeout(timer); timer = setTimeout(translate, 400); });
$("go").onclick = translate;
src.onchange = tgt.onchange = translate;
$("swap").onclick = () => {
  const from = src.value === "auto" ? (lastLang && LANGS[lastLang] ? lastLang : "ru") : src.value;
  src.value = tgt.value; tgt.value = from;
  if (output.textContent) input.value = output.textContent;
  updCount(); translate();
};
$("clear").onclick = () => { input.value = ""; output.textContent = ""; updCount(); input.focus(); };
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(output.textContent); setStatus("Скопировано"); }
  catch { const r = document.createRange(); r.selectNodeContents(output);
          getSelection().removeAllRanges(); getSelection().addRange(r); setStatus("Выделено, нажмите Ctrl+C"); }
};

// ---------- картинки (OCR) ----------
async function ocr(file) {
  if (!file || !file.type.startsWith("image/")) { setStatus("Это не картинка", true); return; }
  try {
    setStatus("Распознаю текст на картинке…");
    prog.hidden = false; prog.value = 0;
    const langs = [...new Set([...LANGS[src.value][1].split("+"), "eng"])].join("+");
    const { data } = await Tesseract.recognize(file, langs, {
      logger: m => { if (m.progress != null) { prog.value = m.progress * 100;
        setStatus(m.status === "recognizing text" ? `Распознаю: ${Math.round(m.progress*100)}%` : "Готовлю распознавание…"); } }
    });
    const text = data.text.replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
    if (!text) { setStatus("На картинке не нашлось текста", true); prog.hidden = true; return; }
    input.value = text; updCount();
    prog.hidden = true;
    translate();
  } catch (e) {
    console.error(e); prog.hidden = true;
    setStatus("Не удалось распознать картинку", true);
  }
}

$("pick").onclick = () => $("file").click();
$("file").onchange = e => ocr(e.target.files[0]);
const drop = $("drop");
["dragenter","dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("drag"); }));
["dragleave","drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("drag"); }));
drop.addEventListener("drop", e => ocr(e.dataTransfer.files[0]));
document.addEventListener("paste", e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
  if (item) { e.preventDefault(); ocr(item.getAsFile()); }
});

updCount();
translate();
</script>
</body>
</html>
